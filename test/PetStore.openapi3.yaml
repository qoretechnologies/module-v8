openapi: "3.0.3"
info:
  description: "This is a sample server Petstore server using OpenAPI 3.0."
  version: "1.0.0"
  title: "OpenAPI 3.0 Petstore"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: "https://petstore.swagger.io/v2"
tags:
  - name: "pet"
    description: "Everything about your Pets"
paths:
  /pet:
    post:
      tags:
        - "pet"
      summary: "Add a new pet to the store"
      operationId: "addPet"
      requestBody:
        description: "Pet object that needs to be added to the store"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "405":
          description: "Invalid input"
  /pet/{petId}:
    get:
      tags:
        - "pet"
      summary: "Find pet by ID"
      operationId: "getPetById"
      parameters:
        - name: "petId"
          in: "path"
          description: "ID of pet to return"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: "Invalid ID supplied"
        "404":
          description: "Pet not found"
components:
  schemas:
    Pet:
      type: "object"
      required:
        - "name"
        - "photoUrls"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
          example: "doggie"
        photoUrls:
          type: "array"
          items:
            type: "string"
        status:
          type: "string"
          description: "pet status in the store"
          enum:
            - "available"
            - "pending"
            - "sold"
