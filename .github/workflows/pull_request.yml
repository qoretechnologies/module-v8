  CLICK_UP_TOKEN: ${{ fromJson(secrets.TEST_VARIABLES).CLICK_UP_TOKEN }}
  WEBFLOW_TOKEN: ${{ fromJson(secrets.TEST_VARIABLES).WEBFLOW_TOKEN }}
  ACTIVE_CAMPAIGN_INSTANCE_URL: ${{ fromJson(secrets.TEST_VARIABLES).ACTIVE_CAMPAIGN_INSTANCE_URL }}
  ACTIVE_CAMPAIGN_TOKEN: ${{ fromJson(secrets.TEST_VARIABLES).ACTIVE_CAMPAIGN_TOKEN }}
  BROWSE_AI_API_KEY: ${{ fromJson(secrets.TEST_VARIABLES).BROWSE_AI_API_KEY }}
