name: Pull Request Tests

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the develop branch
on:
  pull_request:
    branches:
      - develop
env:
  ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
  ZENDESK_USER: ${{ secrets.ZENDESK_USER }}
  ZENDESK_API_KEY: ${{ secrets.ZENDESK_API_KEY }}
  GH_PAT: ${{ secrets.GH_PAT }}
  ASANA_PAT: ${{ secrets.ASANA_PAT }}
  ASANA_WORKSPACE_ID: ${{ secrets.ASANA_WORKSPACE_ID }}
  GH_PAT_FOR_SECRETS: ${{ secrets.GH_PAT_FOR_SECRETS }}
  GH_MODULE_REPO_OWNER: ${{ secrets.GH_MODULE_REPO_OWNER }}
  GH_MODULE_REPO_NAME: ${{ secrets.GH_MODULE_REPO_NAME }}
  GH_MODULE_DOCUSIGN_SECRET_NAME: ${{ secrets.GH_MODULE_DOCUSIGN_SECRET_NAME }}
  DOCUSIGN_REFRESH_TOKEN: ${{ secrets.DOCUSIGN_REFRESH_TOKEN }}
  DOCUSIGN_CLIENT_ID: ${{ secrets.DOCUSIGN_CLIENT_ID }}
  DOCUSIGN_CLIENT_SECRET: ${{ secrets.DOCUSIGN_CLIENT_SECRET }}
  FRESHDESK_SUBDOMAIN: ${{ secrets.FRESHDESK_SUBDOMAIN }}
  FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
  PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
  CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
  ZENDESK_REFRESH_TOKEN: ${{ secrets.ZENDESK_REFRESH_TOKEN }}

jobs:
  # App catalogue TypeScript build + jest unit tests. Nothing here needs Qore, so this
  # runs in parallel with the qore_tests job instead of ahead of it.
  unit_tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    outputs:
      # Full breakdown (counts, and failing apps with the line that failed) for the notification
      summary_json: ${{ steps.unit_tests.outputs.summary_json }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Get repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # Install App Catalogue dependencies
      - name: Installing modules
        id: install_modules
        run: |
          cd ts
          yarn install

      # Run App Catalogue build test
      - name: Run build test
        run: |
          cd ts
          yarn build:test

      # Check system resources
      - name: Check system resources
        run: |
          df -h
          free -h
          node --version
          npm --version

      # Mask the live service suites' credentials and hand them to the step below. Nothing before
      # it needs them, and the other jobs never get them.
      - name: Load test variables
        env:
          TEST_VARIABLES: ${{ secrets.TEST_VARIABLES }}
        run: node test/docker_test/load-test-variables.cjs

      # Run App Catalogue unit tests
      - name: Run unit tests
        id: unit_tests
        timeout-minutes: 60
        run: |
          cd ts
          set +e
          node --experimental-vm-modules \
            ./node_modules/jest/bin/jest.js --ci --maxWorkers=100% --workerIdleMemoryLimit=2048MB \
            --config src/jest.config.ts --json --outputFile=test-results.json
          TEST_EXIT_CODE=$?
          set -e

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "All tests passed."
            exit 0
          fi

          if [ ! -f test-results.json ]; then
            echo "::error::Jest failed (exit code $TEST_EXIT_CODE) and produced no results file."
            exit 1
          fi

          # App integration tests hit live third-party APIs, so failures (5xx, rate
          # limits, expired credentials, stateful test data) are unreliable signals and
          # must not block the PR. Never fail the job on individual test failures; instead
          # collect the affected apps and surface them in the Discord notification so a
          # human can check them. Only a genuine harness breakage (jest failed but produced
          # no identifiable test results — e.g. a compile/config error) still fails.
          python3 << 'PYEOF'
          import json, sys, re, os

          TRANSIENT_PATTERNS = [
              r"Exceeded timeout of \d+ ms",
              r"ECONNREFUSED", r"ETIMEDOUT", r"ENOTFOUND", r"ECONNRESET",
              r"EHOSTUNREACH", r"EPIPE", r"EAI_AGAIN", r"socket hang up",
              r"fetch failed", r"network\s*(error|timeout|request failed)",
              r"getaddrinfo", r"connect ENETUNREACH",
              r"\b50[0-9]\b", r"\b429\b", r"rate limit", r"bad gateway",
              r"service unavailable", r"gateway timeout", r"internal server error",
          ]

          try:
              with open("test-results.json") as f:
                  data = json.load(f)
          except (json.JSONDecodeError, OSError) as e:
              print(f"::error::Failed to parse test-results.json: {e}")
              sys.exit(1)

          def app_of(path):
              base = os.path.basename(path or "")
              return re.sub(r"\.test\.ts$", "", base)

          apps = set()
          transient = []
          real = []
          # app -> first failing source line, so the notification can deep-link to it.
          # jest puts "src/tests/<app>.test.ts:<line>:<col>" in the failure stack trace.
          real_at = {}
          transient_at = {}

          for suite in data.get("testResults", []):
              app = app_of(suite.get("name"))
              failed = [t for t in suite.get("assertionResults", []) if t.get("status") == "failed"]
              # A suite can also fail at load/beforeAll level with no assertionResults.
              if suite.get("status") == "failed" or failed:
                  if app:
                      apps.add(app)
              for test in failed:
                  msgs = " ".join(test.get("failureMessages", []))
                  name = " › ".join(test.get("ancestorTitles", []) + [test.get("title", "")])
                  is_transient = any(re.search(p, msgs, re.IGNORECASE) for p in TRANSIENT_PATTERNS)
                  (transient if is_transient else real).append(name)
                  if app:
                      hit = re.search(re.escape(app) + r"\.test\.ts:(\d+):", msgs)
                      where = transient_at if is_transient else real_at
                      # Keep the app even when this particular message carries no line, but let
                      # a later failure that does have one fill it in. setdefault() alone would
                      # pin the first None and lose a line the next failure could have supplied.
                      if where.get(app) is None:
                          where[app] = int(hit.group(1)) if hit else None

          if transient:
              print(f"::warning::{len(transient)} transient test failure(s) (timeouts/5xx/rate-limit):")
              for t in transient:
                  print(f"  - {t}")

          if real:
              print(f"::warning::{len(real)} non-transient test failure(s) — please verify the affected app(s):")
              for r in real:
                  print(f"  - {r}")

          total_suites = data.get("numTotalTestSuites") or 0
          failed_suites = data.get("numFailedTestSuites") or 0
          total_tests = data.get("numTotalTests") or 0

          # Emitted before the failure checks below so the notification still has the full
          # picture on a run that ends up failing — that is exactly when it matters most.
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              summary = {
                  "total_suites": total_suites,
                  "failed_suites": failed_suites,
                  "total_tests": total_tests,
                  "passed_tests": data.get("numPassedTests") or 0,
                  "real": [{"app": a, "line": l} for a, l in sorted(real_at.items())],
                  "transient": [{"app": a, "line": l} for a, l in sorted(transient_at.items())],
                  "apps": sorted(apps),
              }
              with open(gh_out, "a") as f:
                  f.write("summary_json=" + json.dumps(summary, separators=(",", ":")) + "\n")

          if not apps and not transient and not real:
              # Jest failed but no individual test failures found — config/compile error.
              print("::error::Jest failed but no individual test results were found in the output.")
              sys.exit(1)

          # Tolerating app failures must not extend to tolerating a broken harness. Run #722
          # reported success while every suite failed and nothing ran at all (jest workers
          # OOMed), which is exactly the outcome this pipeline must never call green.

          if total_tests == 0:
              print(f"::error::No tests executed at all ({failed_suites}/{total_suites} suites "
                    "failed to run). This is a harness failure, not app flakiness.")
              sys.exit(1)

          if total_suites and failed_suites / total_suites > 0.5:
              pct = 100 * failed_suites / total_suites
              print(f"::error::{failed_suites}/{total_suites} suites failed ({pct:.0f}%). A failure "
                    "rate that high is systemic (harness/config/network), not per-app flakiness.")
              sys.exit(1)

          if apps:
              app_list = ", ".join(sorted(apps))
              print(f"::warning::App test suites need review (not blocking the pipeline): {app_list}")

          print("Continuing pipeline; test-suite failures reported to Discord.")
          sys.exit(0)
          PYEOF
        env:
          # Workers transpile instead of type-checking now (see ts/tsconfig.jest.json), so a
          # suite costs ~350MB of heap rather than >4GB. This ceiling is headroom, not a
          # target: four workers at that size use well under a quarter of the 15GB runner.
          NODE_OPTIONS: "--max_old_space_size=4096"

  # module-v8's Qore-side build and its Qore tests. Runs in parallel with unit_tests:
  # none of these steps depend on the jest suites, and previously they sat behind
  # ~38 minutes of them in the same job.
  #
  # The job runs in qore-test-base, the same image GitLab CI uses (see .gitlab-ci.yml).
  # That image already ships qore develop plus every module this job used to clone and
  # build for itself -- yaml, uuid, json, process -- together with the node 24 dev files,
  # LLVM, OpenSSL 3.5 and Arrow it needed to build them. Doing that per run cost ~22 of
  # the job's ~28 minutes, and caching only ever covered part of it: the OpenSSL-from-
  # source and apt steps ran even on a cache hit. What is left below is the work that is
  # actually specific to the pull request.
  qore_tests:
    runs-on: ubuntu-24.04
    container:
      image: registry.qoretechnologies.com/infrastructure/qore-test-base/qore-test-base:develop
      # Read-only (read_registry) deploy token for infrastructure/qore-test-base. Held as
      # organization secrets, not repository ones: this repository sits at GitHub's limit
      # of 100 repository secrets, so a 101st is rejected.
      credentials:
        username: ${{ secrets.QORE_REGISTRY_USER }}
        password: ${{ secrets.QORE_REGISTRY_TOKEN }}
    # A container job defaults to `sh`, not `bash`: GitHub cannot assume bash exists in an
    # arbitrary image. This one has it, and the steps below want it (indirect expansion in
    # "Publish image environment" is a bash feature that dash rejects outright).
    defaults:
      run:
        shell: bash
    steps:
      - name: Get repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The image keeps its toolchain out of the default environment and in /tmp/env.sh:
      # qore lives under /opt, node under /opt/nodejs. Every GitHub step runs in a fresh
      # shell that does not source that file, so publish what the later steps need once.
      #
      # QORE_TYPESCRIPT_MASTER_ACTION_SCRIPT is deliberately NOT published: in the image it
      # points at a TypeScript dist built from develop, and these tests must run against
      # the dist built from this branch. test-ubuntu.sh rebuilds that dist and repoints the
      # variable itself, so leaving it unset here keeps the stale one from being picked up.
      - name: Publish image environment
        run: |
          . /tmp/env.sh
          printf '%s\n' "${INSTALL_PREFIX}/bin" "${NODEJS_INSTALL_PREFIX}/bin" >> "$GITHUB_PATH"
          for var in LD_LIBRARY_PATH INSTALL_PREFIX NODE_LIB_DIR NODE_INCLUDE_DIR QORE_MODULE_DIR; do
            printf '%s=%s\n' "${var}" "${!var}"
          done >> "$GITHUB_ENV"

      - name: Verify Qore installation
        run: qore --version

      # Builds the module from this branch over the image's copy, rebuilds the TypeScript
      # dist so the Qore tests exercise this branch's catalogue, and runs every
      # test/*.qtest as an unprivileged user. This is the script GitLab CI runs, so the two
      # pipelines share one sequence instead of maintaining two that drift apart.
      - name: Build and test module-v8
        run: test/docker_test/test-ubuntu.sh

      # Test catalogue actions made with schema
      - name: Test catalogue actions
        run: |
          cd ts
          NODE_OPTIONS="--max_old_space_size=8192" yarn test-build && NODE_OPTIONS="--max_old_space_size=8192" QORE_TYPESCRIPT_ACTION_SCRIPTS=./dist/index.js QORE_TYPESCRIPT_ACTION_TEST_SCRIPTS=./dist/index.js qore -l TypeScriptActionInterface -nX 1

  # Single notification point for both jobs above. Runs even when one of them fails so
  # the Discord webhook still fires exactly once per run.
  notify:
    needs: [unit_tests, qore_tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Shallow checkout: only needed to read the head commit message below
      - name: Get repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Print head git commit message
        id: get_head_commit_message
        run: echo "HEAD_COMMIT_MESSAGE=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"

      # Per-job results and durations for the notification. Uses the Actions API because a
      # job cannot see its siblings' timings through the needs context.
      - name: Collect job results
        id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Emit one object per job and slurp them into a single array: with --paginate, gh
          # applies the jq filter per page, so a filter that builds its own array would emit
          # one array per page and land a multi-line value in GITHUB_OUTPUT.
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | {name, conclusion, url: .html_url,
                  minutes: (if .started_at and .completed_at
                            then (((.completed_at|fromdateiso8601) - (.started_at|fromdateiso8601)) / 60 | floor | tostring) + "m"
                            else null end)}' | jq -sc . > /tmp/jobs.json
          echo "jobs_json=$(cat /tmp/jobs.json)" >> "$GITHUB_OUTPUT"

      # Components V2 message (link buttons, avatar accessory, deep links to failing lines).
      # Sent by a script rather than an action because Ilshidur/action-discord can only post
      # content and classic embeds, which cannot carry components or the required flag.
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.triggering_actor }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          COMMIT_MSG: ${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}
          JOBS_JSON: ${{ steps.jobs.outputs.jobs_json }}
          SUMMARY_JSON: ${{ needs.unit_tests.outputs.summary_json }}
        run: python3 .github/scripts/discord-notify.py
