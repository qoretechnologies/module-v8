jobs:
  PullRequestTests:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Get current time for the commit
      - name: Get current time
        uses: josStorer/get-current-time@v2.0.2
        id: current_time
        with:
          format: YYYYMMDD-HH
          utcOffset: "+01:00"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Get repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Print head git commit message
        id: get_head_commit_message
        run: echo "HEAD_COMMIT_MESSAGE=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # Install App Catalogue dependencies
      - name: Installing modules
        id: install_modules
        run: |
          cd ts
          yarn install

      # Run App Catalogue build test
      - name: Run build test
        run: |
          cd ts
          yarn build:test

      # Check system resources
      - name: Check system resources
        run: |
          df -h
          free -h
          node --version
          npm --version

      # Run App Catalogue unit tests
      - name: Run unit tests
        timeout-minutes: 60
        run: |
          cd ts
          set +e
          node --experimental-vm-modules \
            ./node_modules/jest/bin/jest.js --ci --maxWorkers=50% --workerIdleMemoryLimit=2048MB \
            --config src/jest.config.ts --json --outputFile=test-results.json
          TEST_EXIT_CODE=$?
          set -e

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "All tests passed."
            exit 0
          fi

          if [ ! -f test-results.json ]; then
            echo "::error::Jest failed (exit code $TEST_EXIT_CODE) and produced no results file."
            exit 1
          fi

          # App integration tests hit live third-party APIs, so failures (5xx, rate
          # limits, expired credentials, stateful test data) are unreliable signals and
          # must not block the PR. Never fail the job on individual test failures; instead
          # collect the affected apps and surface them in the Discord notification so a
          # human can check them. Only a genuine harness breakage (jest failed but produced
          # no identifiable test results — e.g. a compile/config error) still fails.
          python3 << 'PYEOF'
          import json, sys, re, os

          TRANSIENT_PATTERNS = [
              r"Exceeded timeout of \d+ ms",
              r"ECONNREFUSED", r"ETIMEDOUT", r"ENOTFOUND", r"ECONNRESET",
              r"EHOSTUNREACH", r"EPIPE", r"EAI_AGAIN", r"socket hang up",
              r"fetch failed", r"network\s*(error|timeout|request failed)",
              r"getaddrinfo", r"connect ENETUNREACH",
              r"\b50[0-9]\b", r"\b429\b", r"rate limit", r"bad gateway",
              r"service unavailable", r"gateway timeout", r"internal server error",
          ]

          try:
              with open("test-results.json") as f:
                  data = json.load(f)
          except (json.JSONDecodeError, OSError) as e:
              print(f"::error::Failed to parse test-results.json: {e}")
              sys.exit(1)

          def app_of(path):
              base = os.path.basename(path or "")
              return re.sub(r"\.test\.ts$", "", base)

          apps = set()
          transient = []
          real = []

          for suite in data.get("testResults", []):
              app = app_of(suite.get("name"))
              failed = [t for t in suite.get("assertionResults", []) if t.get("status") == "failed"]
              # A suite can also fail at load/beforeAll level with no assertionResults.
              if suite.get("status") == "failed" or failed:
                  if app:
                      apps.add(app)
              for test in failed:
                  msgs = " ".join(test.get("failureMessages", []))
                  name = " › ".join(test.get("ancestorTitles", []) + [test.get("title", "")])
                  bucket = transient if any(re.search(p, msgs, re.IGNORECASE) for p in TRANSIENT_PATTERNS) else real
                  bucket.append(name)

          if transient:
              print(f"::warning::{len(transient)} transient test failure(s) (timeouts/5xx/rate-limit):")
              for t in transient:
                  print(f"  - {t}")

          if real:
              print(f"::warning::{len(real)} non-transient test failure(s) — please verify the affected app(s):")
              for r in real:
                  print(f"  - {r}")

          if not apps and not transient and not real:
              # Jest failed but no individual test failures found — config/compile error.
              print("::error::Jest failed but no individual test results were found in the output.")
              sys.exit(1)

          if apps:
              app_list = ", ".join(sorted(apps))
              print(f"::warning::App test suites need review (not blocking the pipeline): {app_list}")
              gh_env = os.environ.get("GITHUB_ENV")
              if gh_env:
                  with open(gh_env, "a") as f:
                      f.write(f"APPS_TO_CHECK={app_list}\n")

          print("Continuing pipeline; test-suite failures reported to Discord.")
          sys.exit(0)
          PYEOF
        env:
          NODE_OPTIONS: "--max_old_space_size=16384"

      # Install system dependencies needed for building Qore and modules
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            pkg-config \
            flex \
            bison \
            libmpfr-dev \
            libpcre3-dev \
            zlib1g-dev \
            libbz2-dev \
            libbrotli-dev \
            libzstd-dev \
            liblz4-dev \
            libkrb5-dev \
            libutf8proc-dev \
            libnghttp2-dev \
            doxygen \
            libyaml-dev \
            uuid-dev \
            libeigen3-dev \
            libprotobuf-dev \
            libprotoc-dev \
            protobuf-compiler \
            libssh2-1-dev \
            libssh-dev

      # Qore's in-tree dataframe module requires Apache Arrow/Parquet headers
      # (modules/dataframe/src/df_parquet.cpp -> arrow/api.h). Ubuntu 24.04 has no
      # libarrow-dev in apt (it's only in universe on 26.04, which is why the canonical
      # qore-test-base image gets it from apt), so add Apache's own apt repo here.
      - name: Install Apache Arrow
        run: |
          cd /tmp
          curl -fsSL -o apache-arrow.deb \
            "https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y ./apache-arrow.deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev libparquet-dev

      # Install OpenSSL 3.5+ with native QUIC support (SSL_set_quic_tls_cbs)
      # System OpenSSL 3.0.x lacks QUIC APIs needed by ngtcp2 for Qore's HTTP/3 support
      # Qore's CI Docker images do the same via /etc/profile.d/quic.sh + OPENSSL_ROOT_DIR
      - name: Install OpenSSL 3.5
        run: |
          # Remove system OpenSSL dev headers to avoid conflicts with OpenSSL 3.5
          sudo apt-get remove -y libssl-dev 2>/dev/null || true
          OPENSSL_VERSION="3.5.0"
          OPENSSL_PREFIX="/opt/openssl-3.5"
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o /tmp/openssl.tar.gz
          cd /tmp && tar xzf openssl.tar.gz
          cd "/tmp/openssl-${OPENSSL_VERSION}"
          ./Configure --prefix=${OPENSSL_PREFIX} --libdir=lib no-tests
          make -j$(nproc)
          sudo make install_sw
          echo "${OPENSSL_PREFIX}/lib" | sudo tee /etc/ld.so.conf.d/openssl35.conf
          sudo ldconfig
          echo "OPENSSL_ROOT_DIR=${OPENSSL_PREFIX}" >> $GITHUB_ENV

      # Install pre-built Node.js 24 with development headers and libnode.so
      - name: Install Node.js 24 development files
        run: |
          NODEJS_VERSION="24.11.1"
          NODEJS_INSTALL_PREFIX="/opt/nodejs"
          NODEJS_ARCH="amd64"
          NODEJS_TARBALL="nodejs-${NODEJS_VERSION}-ubuntu24.04-${NODEJS_ARCH}.tar.bz2"
          curl -fsSL -O "https://hq.qoretechnologies.com/~pchalupny/node-builds/${NODEJS_TARBALL}"
          sudo tar -xjf ${NODEJS_TARBALL} -C /
          rm -f ${NODEJS_TARBALL}
          # Create symlink for libnode.so
          lib=$(ls ${NODEJS_INSTALL_PREFIX}/lib/libnode.so.* | sort | tail -n 1)
          sudo ln -sf "$(basename "$lib")" ${NODEJS_INSTALL_PREFIX}/lib/libnode.so
          echo "Node.js 24 dev files installed"
          ls ${NODEJS_INSTALL_PREFIX}/include/node/v8.h

      # Ubuntu 24.04's default LLVM is 18, which is too old to compile current Qore
      # develop (its JIT/AOT support tracks newer LLVM releases). Install LLVM 21 — the
      # version Qore's canonical build-tools/setup-ubuntu.sh uses — from apt.llvm.org and
      # point CMake at it (find_package(LLVM CONFIG) honours LLVM_DIR / CMAKE_PREFIX_PATH).
      # Add the repo with curl, not llvm.sh/wget: wget fails SSL verification after the
      # OpenSSL 3.5 swap above (and llvm.sh uses wget internally). The apt line is http +
      # gpg-signed (integrity via signed-by), so it sidesteps apt TLS too.
      - name: Install LLVM 21 for Qore build
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev
          LLVM_PREFIX=$(ls -d /usr/lib/llvm-* | sort -V | tail -1)
          echo "Selected LLVM prefix: ${LLVM_PREFIX}"
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${LLVM_PREFIX}:${CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"

      # Clone the Qore repository and build it
      - name: Clone and Build Qore
        run: |
          git clone --branch develop https://github.com/qoretechnologies/qore.git
          cd qore
          mkdir build
          cd build
          V8_INCLUDE_DIR=/opt/nodejs/include/node NODE_LIB_DIR=/opt/nodejs/lib cmake .. -DSINGLE_COMPILATION_UNIT=1 -DCMAKE_BUILD_TYPE=release
          make -j$(nproc) && sudo make install

      #  Update library paths to ensure Qore can find its shared libraries
      - name: Update Library Path
        run: |
          echo '/usr/local/lib' | sudo tee /etc/ld.so.conf.d/qore.conf
          echo '/opt/nodejs/lib' | sudo tee -a /etc/ld.so.conf.d/qore.conf
          sudo ldconfig

      # Verify Qore installation by checking the version
      - name: Verify Qore Installation
        run: qore --version

      # Clone and build yaml-module
      - name: Clone and build yaml module
        run: |
          git clone https://github.com/qoretechnologies/module-yaml.git
          cd module-yaml
          mkdir build
          cd build
          cmake .. -DSINGLE_COMPILATION_UNIT=1 -DCMAKE_BUILD_TYPE=release
          make && sudo make install

      # Clone and build uuid-module
      - name: Clone and build uuid module
        run: |
          git clone https://github.com/qoretechnologies/module-uuid.git
          cd module-uuid
          mkdir build
          cd build
          cmake .. -DSINGLE_COMPILATION_UNIT=1 -DCMAKE_BUILD_TYPE=release
          make && sudo make install

      # Clone and build json-module
      - name: Clone and build json-module
        run: |
          git clone https://github.com/qoretechnologies/module-json.git
          cd module-json
          git submodule update --init
          mkdir build
          cd build
          cmake .. -DSINGLE_COMPILATION_UNIT=1 -DCMAKE_BUILD_TYPE=release
          make && sudo make install

      # Clone and build process-module
      - name: Clone and build process-module
        run: |
          git clone https://github.com/qoretechnologies/module-process.git
          cd module-process
          mkdir build
          cd build
          cmake .. -DSINGLE_COMPILATION_UNIT=1 -DCMAKE_BUILD_TYPE=release
          make && sudo make install

      # Build V8-module
      - name: Build V8-module
        run: |
          git submodule update --init
          mkdir build
          cd build
          NODE_INCLUDE_DIR=/opt/nodejs/include/node NODE_LIB_DIR=/opt/nodejs/lib cmake .. -DSINGLE_COMPILATION_UNIT=1 -DCMAKE_BUILD_TYPE=release
          make && sudo make install

      # Run module-v8 Qore tests
      - name: Run module-v8 tests
        run: |
          cd test
          qore --enable-debug v8.qtest -v
          qore --enable-debug ts-proxy.qtest -v
          qore --enable-debug ts-action-interface.qtest -v

      # Install RestSchemaDataProvider module (not yet in Qore's CMakeLists.txt)
      - name: Install RestSchemaDataProvider module
        run: |
          echo "Installing RestSchemaDataProvider from qore source..."
          sudo cp -r qore/qlib/RestSchemaDataProvider /usr/local/share/qore-modules/
          echo "Verifying installation..."
          ls -la /usr/local/share/qore-modules/RestSchemaDataProvider/

      # Test catalogue actions made with schema
      - name: Test catalogue actions
        run: |
          cd ts
          NODE_OPTIONS="--max_old_space_size=8192" yarn test-build && NODE_OPTIONS="--max_old_space_size=8192" QORE_TYPESCRIPT_ACTION_SCRIPTS=./dist/index.js QORE_TYPESCRIPT_ACTION_TEST_SCRIPTS=./dist/index.js qore -l TypeScriptActionInterface -nX 1

      # Notify Discord if Success
      - name: Discord notification success
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
          DISCORD_EMBEDS: '[{ "author": {  "icon_url": "https://avatars.githubusercontent.com/${{ github.actor }}", "name": "${{ github.actor }}", "url": "https://github.com/${{github.actor}}" },"url": "https://github.com/${{github.repository}}/commit/${{github.sha}}","fields": [{ "name": "Commit Message", "value": "${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}"},{ "name": "Repository", "value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})", "inline": true },{ "name": "Branch", "value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/pull/${{github.ref_name}})", "inline": true },{ "name": "Event", "value": "${{github.event_name}}", "inline": true },{ "name": "Author", "value": "[${{github.actor}}](https://github.com/${{github.actor}})", "inline": true },{ "name": "Job", "value": "${{github.job}}", "inline": true},{ "name": "Version", "value": "v${{ steps.save_release_version.outputs.version }}", "inline": true},{ "name": "", "value": "🤖 [Github Action](https://github.com/${{ github.repository}}/actions/runs/${{ github.run_id}})"}],"color":65280,"footer":{"text": "Published at ${{steps.current_time.outputs.readableTime}}"}}]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/qorus-vscode/blob/95ad81fa8654fe83bb41f68f4de42ae088298e59/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: ":white_check_mark: Tests run #${{ github.run_number }} for [PR](${{ github.event.pull_request.html_url }}) triggered by ${{ github.triggering_actor }} *succeeded*, install the canary version via `yarn add @qoretechnologies/qorus-actions-catalogue@${{ steps.bump.outputs.version }}`.${{ env.APPS_TO_CHECK != '' && format(' :warning: **Apps with test failures — please check:** {0}', env.APPS_TO_CHECK) || '' }}"
        if: success()

      # Notify discord if failure
      - name: Discord notification failure
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
          DISCORD_EMBEDS: '[{ "author": {  "icon_url": "https://avatars.githubusercontent.com/${{ github.actor }}", "name": "${{ github.actor }}", "url": "https://github.com/${{github.actor}}" },"url": "https://github.com/${{github.repository}}/commit/${{github.sha}}","fields": [{ "name": "Commit Message", "value": "${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}"},{ "name": "Repository", "value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})", "inline": true },{ "name": "Branch", "value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/pull/${{github.ref_name}})", "inline": true },{ "name": "Event", "value": "${{github.event_name}}", "inline": true },{ "name": "Author", "value": "[${{github.actor}}](https://github.com/${{github.actor}})", "inline": true },{ "name": "Job", "value": "${{github.job}}", "inline": true },{ "name": "Version", "value": "v${{ steps.save_release_version.outputs.version }}", "inline": true},{ "name": "", "value": "🤖 [Github Action](https://github.com/${{ github.repository}}/actions/runs/${{ github.run_id}})"}],"color":16711680,"footer":{"text": "Published at ${{steps.current_time.outputs.readableTime}}"}}]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/qorus-vscode/blob/95ad81fa8654fe83bb41f68f4de42ae088298e59/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: ":exclamation: Tests run #${{ github.run_number }} for [PR](${{ github.event.pull_request.html_url }}) triggered by ${{ github.triggering_actor }} *failed*!"
        if: failure()
