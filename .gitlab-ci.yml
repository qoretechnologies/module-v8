stages:
  - test

default:
  tags:
    - k8s
    - amd64
  before_script:
    # A push to develop whose identical tree already passed both platform jobs publishes success and skips the job
    - . test/docker_test/tree-tested-skip.sh
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  REPO_NAME: module-v8
  GIT_SUBMODULE_STRATEGY: recursive
  # CI reads the upstream schema documents that it qualifies from this private mirror (the project's generic package
  # registry) with the job token, each by the SHA-256 pinned in test/docker_test/schema-inputs.json
  QORE_SCHEMA_INPUT_MIRROR: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/schema-inputs"

# Reuse successful tests only for a push to develop with an identical Git tree (for example the merge of a pull request
# whose branch pipeline passed). Missing or incomplete API evidence retains both full platform jobs; set
# QORE_CI_FORCE_FULL=1 to run them regardless. Scheduled pipelines are never eligible.
tree-already-tested:
  stage: .pre
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  before_script: []
  variables:
    GIT_DEPTH: "3"
    # Only the tree hash is compared, and submodule commits are part of it
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push" && $QORE_CI_FORCE_FULL != "1"'
  script:
    - python3 test/docker_test/tree-already-tested.py
  artifacts:
    reports:
      dotenv: tree-tested.env

test-ubuntu:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  needs: [{job: tree-already-tested, optional: true}]
  # The base-image pipeline publishes branch tags; untagged digests are not retained.
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  script:
    - |
        if test/docker_test/test-ubuntu.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days

test-alpine:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  needs: [{job: tree-already-tested, optional: true}]
  # Follow the published Alpine branch tag as well, rather than an unretained digest.
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  script:
    - |
        if test/docker_test/test-alpine.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days

# The daily schedule (QORE_SCHEMA_UPSTREAM_CHECK=1) compares the upstream schema documents with the reviewed pins in
# test/docker_test/schema-inputs.json, reports whether a change affects the supported surface of the generated app
# (comparing with the pinned documents in the mirror), and runs the user-facing update commands against the upstream
# services. It reports on the upstream services, not on a commit, so it leaves the commit's GitHub status alone.
# An upstream service that cannot be reached is not a change: like a test with an unavailable external HTTP
# dependency, it ends the job with a warning (exit status 69), while a change or any other failure fails it.
check-upstream-schemas:
  stage: test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $QORE_SCHEMA_UPSTREAM_CHECK == "1"
  allow_failure:
    exit_codes: [69]
  before_script: []
  script:
    - test/docker_test/test-ubuntu.sh --check-upstream-schemas
